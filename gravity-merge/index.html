<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Privacy Policy and Terms & Conditions for the Gravity Merge Android game.">
  <meta name="theme-color" content="#080b18">
  <title>Gravity Merge Legal</title>
  <style>
    :root{--ink:#f8f9ff;--muted:#aeb8df;--panel:rgba(24,30,67,.92);--line:rgba(127,140,255,.34);--mint:#75f0d1;--gold:#ffc857}
    *{box-sizing:border-box}html{background:#080b18}body{min-height:100vh;margin:0;color:var(--ink);background:radial-gradient(circle at 18% 4%,rgba(119,77,255,.34),transparent 35rem),radial-gradient(circle at 86% 42%,rgba(25,204,184,.18),transparent 30rem),linear-gradient(145deg,#090b1a,#111832 52%,#071b25);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    main{min-height:100vh;padding:48px 22px}.hero{width:min(100%,820px);margin:0 auto;padding-top:clamp(24px,9vh,100px);text-align:center}.brand{display:grid;width:86px;height:86px;margin:0 auto 32px;place-items:center;border:2px solid rgba(117,240,209,.7);border-radius:28px;background:linear-gradient(145deg,#ff4fa3,#6b7cff 56%,#193e59);box-shadow:0 18px 70px rgba(99,91,255,.36);font-size:26px;font-weight:900;letter-spacing:.08em}.eyebrow{margin:0 0 12px;color:var(--mint);font-family:ui-monospace,monospace;font-size:.78rem;font-weight:800;letter-spacing:.24em}h1{margin:0;font-size:clamp(2.45rem,8vw,4.9rem);line-height:.98}.lede{max-width:600px;margin:28px auto 40px;color:var(--muted);font-size:clamp(1rem,2.8vw,1.2rem);line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;text-align:left}.card{display:grid;min-height:190px;padding:28px;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 22px 65px rgba(0,0,0,.24);color:var(--ink);text-decoration:none}.card span{color:var(--gold);font-family:ui-monospace,monospace;font-size:.75rem}.card strong{align-self:end;font-size:1.35rem}.card small{margin-top:8px;color:var(--muted);line-height:1.5}.updated{margin-top:32px;color:#7e89b8;font-family:ui-monospace,monospace;font-size:.76rem}@media(max-width:620px){main{padding:24px 14px}.grid{grid-template-columns:1fr}.card{min-height:155px}}
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="brand">GM</div>
      <p class="eyebrow">GRAVITY MERGE</p>
      <h1>Player information &amp; legal</h1>
      <p class="lede">Clear information about privacy, advertising, and the rules for using Gravity Merge.</p>
      <div class="grid">
        <a class="card" href="privacy.html"><span>01</span><strong>Privacy Policy</strong><small>Data, ads, consent, and your choices</small></a>
        <a class="card" href="terms.html"><span>02</span><strong>Terms &amp; Conditions</strong><small>Rules for using the game</small></a>
      </div>
      <p class="updated">Effective July 23, 2026</p>
    </section>
  </main>
</body>
</html>
